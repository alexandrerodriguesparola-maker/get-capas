name: Montar vídeos grandes
on:
  push:
    paths: ["partes/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Juntar partes e conferir
        run: |
          mkdir saida
          for f in $(ls partes/*.part00 | sed 's/\.part00$//'); do
            n=$(basename $f); cat $f.part* > saida/$n
          done
          cd saida && sha256sum -c ../partes/sha256.txt
      - name: Publicar como release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view videos >/dev/null 2>&1 || gh release create videos --title "Vídeos" --notes "Vídeos originais para o robô de postagem"
          gh release upload videos saida/*.mp4 --clobber
